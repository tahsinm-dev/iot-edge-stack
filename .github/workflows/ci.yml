name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        run: pipx run yamllint .

      - name: Validate docker compose
        run: docker compose -f monitoring/docker-compose.yml config --quiet

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: monitoring/exporter/Dockerfile

  firmware:
    name: Compile ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: PubSubClient
            - name: Adafruit BME280 Library
            - name: Adafruit Unified Sensor
          sketch-paths: |
            - firmware/esp32_bme280_mqtt
