# EDGE uplink - USB adapter (wlan1) connects to the backbone access point.
# Deploy to: /etc/wpa_supplicant/wpa_supplicant-wlan1.conf
# Enable with:  sudo systemctl enable --now wpa_supplicant@wlan1
country=AT
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

network={
    ssid="SERVER-IOT-XX"
    psk="__SERVER_WIFI_PW__"
}
