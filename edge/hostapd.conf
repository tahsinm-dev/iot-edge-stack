# EDGE access point - sensor network (WLAN1), on the on-board radio.
# A different channel than the backbone AP avoids self-interference; the radios
# are independent (USB adapter handles the uplink), so they need not match.
# Deploy to: /etc/hostapd/hostapd.conf
interface=wlan0
driver=nl80211
ssid=EDGE-IOT-XX
hw_mode=g
channel=1
country_code=AT
ieee80211d=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=__EDGE_WIFI_PW__
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
