# Mosquitto broker configuration (containerised stack).
# Authentication is required; the password file is generated from .env by the
# `mosquitto-init` service on first start.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/config/passwordfile

# Plaintext listener for trusted internal services (Docker network).
listener 1883

# TLS listener for external clients / sensors.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
